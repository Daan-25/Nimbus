[package]
name = "nimbus-core"
version = "0.1.0"
edition = "2024"

[lib]
name = "nimbus_core"

[[bin]]
name = "nimbus-helper"
path = "src/main.rs"

[dependencies]
rootcause = "0.12"
anyhow = "1.0.104"
idevice = { version = "0.1.68", default-features = false, features = ["usbmuxd", "tcp", "heartbeat", "ring"] }
isideload = "0.5.2"
rustls = { version = "0.23", default-features = false, features = ["ring"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "sync"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
plist = "1.8"
